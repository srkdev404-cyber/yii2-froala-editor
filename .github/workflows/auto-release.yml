name: Auto Release – yii2-froala-editor

on:
  pull_request:
    types: [closed]
    branches:
      - master

permissions:
  contents: write

jobs:
  release:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    environment: PAT

    steps:
      # ----------------------------------
      # Require "release: yes"
      # ----------------------------------
      - name: Check release intent
        id: check
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.PAT }}
          script: |
            const text =
              (context.payload.pull_request.title || '') + ' ' +
              (context.payload.pull_request.body || '');
            core.setOutput(
              'release',
              /release:\s*yes/i.test(text) ? 'true' : 'false'
            );

      - name: Stop if not release
        if: steps.check.outputs.release == 'false'
        run: exit 0

      # ----------------------------------
      # Checkout merged code
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      # ----------------------------------
      # Read version from composer.json
      # ----------------------------------
      - name: Read version
        run: |
          VERSION=$(jq -r '.version' composer.json)

          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Version not found in composer.json"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      # ----------------------------------
      # Create GitHub Release (NO auto notes)
      # ----------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ env.VERSION }}"
          name: "Yii2 Froala Editor v${{ env.VERSION }}"
          body_path: release_notes.txt
        env:
          GITHUB_TOKEN: ${{ secrets.PAT }}
