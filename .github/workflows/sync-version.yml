name: Sync Version – yii2-froala-editor

on:
  repository_dispatch:
    types: [version_update]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: PAT

    steps:
      # ----------------------------------
      # Checkout repository
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      # ----------------------------------
      # Load version & release notes
      # ----------------------------------
      - name: Load payload
        run: |
          echo "VERSION=${{ github.event.client_payload.version }}" >> $GITHUB_ENV
          echo "${{ github.event.client_payload.release_notes }}" > release_notes.txt
          echo "Incoming version: $VERSION"

      # ----------------------------------
      # Create release branch
      # ----------------------------------
      - name: Create release branch
        run: |
          BRANCH="release-v${VERSION}"
          git checkout -B "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # ----------------------------------
      # Update composer.json version
      # ----------------------------------
      - name: Update composer.json
        run: |
          jq --arg v "$VERSION" '.version = $v' composer.json > composer.tmp
          mv composer.tmp composer.json

      # ----------------------------------
      # Commit & push changes
      # ----------------------------------
      - name: Commit and push
        run: |
          git config user.name "srkdev404-cyber"
          git config user.email "srkdev404@gmail.com"

          git add composer.json release_notes.txt
          git commit -m "chore: release yii2-froala-editor v${VERSION}"
          git push origin "$BRANCH" --force

      # ----------------------------------
      # Create Pull Request
      # ----------------------------------
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body "release: yes"
