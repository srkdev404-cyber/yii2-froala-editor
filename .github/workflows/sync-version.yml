name: Sync Version – yii2-froala-editor

on:
  repository_dispatch:
    types: [version_update]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: PAT

    steps:
      # ----------------------------------
      # Checkout Child-D repo (FIXED)
      # ----------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT }}

      # ----------------------------------
      # Load version from dispatch payload
      # ----------------------------------
      - name: Load version
        run: |
          VERSION="${{ github.event.client_payload.version }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Incoming version: $VERSION"

      # ----------------------------------
      # Create release branch
      # ----------------------------------
      - name: Create release branch
        run: |
          BRANCH="release-v${VERSION}"
          git checkout -b "$BRANCH"
          echo "BRANCH=$BRANCH" >> $GITHUB_ENV

      # ----------------------------------
      # Update composer.json version
      # ----------------------------------
      - name: Update composer.json
        run: |
          jq --arg v "$VERSION" '.version = $v' composer.json > composer.tmp
          mv composer.tmp composer.json

      # ----------------------------------
      # Commit & push changes
      # ----------------------------------
      - name: Commit and push
        run: |
          git config user.name "srkdev404-cyber"
          git config user.email "srkdev404@gmail.com"

          git add composer.json
          git commit -m "chore: bump version to v${VERSION}"
          git push origin "$BRANCH"

      # ----------------------------------
      # Create PR
      # ----------------------------------
      - name: Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT }}
        run: |
          gh pr create \
            --base master \
            --head "$BRANCH" \
            --title "Release v${VERSION}" \
            --body "Automated composer.json version bump to v${VERSION}"
